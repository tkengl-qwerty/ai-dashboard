    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script>
      // Suppress unsolicited browser extension / MetaMask injection errors in preview iframe
      window.addEventListener('error', function (event) {
        var msg = String(event.message || '');
        var src = String(event.filename || '');
        if (msg.indexOf('MetaMask') !== -1 || src.indexOf('chrome-extension://') !== -1) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = String((event.reason && (event.reason.message || event.reason.stack || event.reason)) || '');
        if (reason.indexOf('MetaMask') !== -1 || reason.indexOf('chrome-extension://') !== -1) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
