name: Daily 5:00 AM SGT Refresh & Porkbun Static Build

on:
  push:
    branches:
      - main
  schedule:
    # 21:00 UTC every day = 05:00 AM SGT (UTC+8)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: porkbun-static-deploy
  cancel-in-progress: true

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance google-genai requests

      - name: Run 5:00 AM SGT Macro & Indonesia Data Fetcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/update_daily_macro.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies & Build Static Site
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Publish Built Static Site (dist/) to porkbun-deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: porkbun-deploy
          force_orphan: true
          commit_message: "deploy: static build & daily data for Porkbun [$(date -u +'%Y-%m-%d %H:%M UTC')]"
