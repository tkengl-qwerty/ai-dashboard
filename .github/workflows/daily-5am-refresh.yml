name: Daily 5:00 AM SGT Market Refresh

on:
  schedule:
    # 21:00 UTC every day = 05:00 AM SGT (UTC+8)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance google-genai

      - name: Run 5:00 AM SGT Macro & Indonesia Data Fetcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/update_daily_macro.py

      - name: Commit & Push Updated JSON for Porkbun Auto-Deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/daily_macro.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): daily 05:00 AM SGT market refresh [$(date -u +'%Y-%m-%d')]"
            git push
          fi
